version: "3.8"

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ==============================================================================
  # OpenViking 长效记忆服务
  # ==============================================================================
  openviking:
    build: ./docker/openviking
    container_name: openviking
    restart: unless-stopped
    logging: *default-logging
    environment:
      TZ: Asia/Shanghai
      # === OpenViking 统一 API Key / Base（embed 和 vlm 用同一供应商时只填这两项）===
      OV_API_KEY: ${OV_API_KEY:-${LLM_API_KEY}}
      OV_API_BASE: ${OV_API_BASE:-${LLM_BASE_URL}}
      # === Embedding 配置 ===
      OPENVIKING_EMBED_PROVIDER: ${OPENVIKING_EMBED_PROVIDER:-openai}
      OPENVIKING_EMBED_API_KEY:  ${OPENVIKING_EMBED_API_KEY}
      OPENVIKING_EMBED_API_BASE: ${OPENVIKING_EMBED_API_BASE}
      OPENVIKING_EMBED_MODEL:    ${OPENVIKING_EMBED_MODEL:-text-embedding-3-small}
      OPENVIKING_EMBED_DIM:      ${OPENVIKING_EMBED_DIM:-1536}
      # === VLM 配置 ===
      OPENVIKING_VLM_PROVIDER:   ${OPENVIKING_VLM_PROVIDER:-openai}
      OPENVIKING_VLM_API_KEY:    ${OPENVIKING_VLM_API_KEY}
      OPENVIKING_VLM_API_BASE:   ${OPENVIKING_VLM_API_BASE}
      OPENVIKING_VLM_MODEL:      ${OPENVIKING_VLM_MODEL:-gpt-4o-mini}
    volumes:
      - openviking-data:/root/.openviking
    ports:
      - "${OPENVIKING_PORT:-1933}:1933"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:1933/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  openclaw-pack:
    build: .
    image: ${APP_IMAGE:-kirklin/openclaw-pack:latest}
    container_name: openclaw-pack
    restart: unless-stopped
    logging: *default-logging
    init: true
    depends_on:
      openviking:
        condition: service_healthy
        required: false
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    user: ${APP_RUN_USER:-0:0}
    ports:
      - "${OPENCLAW_GATEWAY_PORT:-18789}:18789"
      - "${OPENCLAW_BRIDGE_PORT:-18790}:18790"
    volumes:
      - ${APP_DATA_DIR:-~/.openclaw}:/home/node/.openclaw
      - /home/node/.openclaw/extensions
    environment:
      # Core Env
      TZ: Asia/Shanghai
      TERM: xterm-256color
      HOME: /home/node
      APP_WORKSPACE: ${APP_WORKSPACE:-/home/node/.openclaw/workspace}

      # Plugin Auth & Flags
      OPENCLAW_PLUGINS_ENABLED: ${OPENCLAW_PLUGINS_ENABLED:-true}

      # Model Config Injection
      LLM_AUTO_SYNC: ${LLM_AUTO_SYNC:-true}
      LLM_PRIMARY_MODEL: ${LLM_PRIMARY_MODEL}
      LLM_VISION_MODEL: ${LLM_VISION_MODEL}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_API_FORMAT: ${LLM_API_FORMAT}
      LLM_CTX_WINDOW: ${LLM_CTX_WINDOW}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS}

      # Secondary Provider Config
      LLM_SECONDARY_NAME: ${LLM_SECONDARY_NAME}
      LLM_SECONDARY_MODEL_ID: ${LLM_SECONDARY_MODEL_ID}
      LLM_SECONDARY_BASE_URL: ${LLM_SECONDARY_BASE_URL}
      LLM_SECONDARY_API_KEY: ${LLM_SECONDARY_API_KEY}
      LLM_SECONDARY_PROTOCOL: ${LLM_SECONDARY_PROTOCOL}
      LLM_SECONDARY_CONTEXT_WINDOW: ${LLM_SECONDARY_CONTEXT_WINDOW}
      LLM_SECONDARY_MAX_TOKENS: ${LLM_SECONDARY_MAX_TOKENS}

      # Third Provider Config (Gemini)
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      LLM_THIRD_NAME: ${LLM_THIRD_NAME}
      LLM_THIRD_MODEL_ID: ${LLM_THIRD_MODEL_ID}
      LLM_THIRD_BASE_URL: ${LLM_THIRD_BASE_URL}
      LLM_THIRD_PROTOCOL: ${LLM_THIRD_PROTOCOL}
      LLM_THIRD_CONTEXT_WINDOW: ${LLM_THIRD_CONTEXT_WINDOW}
      LLM_THIRD_MAX_TOKENS: ${LLM_THIRD_MAX_TOKENS}

      # Gateway API & UI Options
      OPENCLAW_GATEWAY_PORT: ${OPENCLAW_GATEWAY_PORT}
      OPENCLAW_BRIDGE_PORT: ${OPENCLAW_BRIDGE_PORT}
      OPENCLAW_GATEWAY_BIND: ${OPENCLAW_GATEWAY_BIND}
      OPENCLAW_GATEWAY_MODE: ${OPENCLAW_GATEWAY_MODE}
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      OPENCLAW_GATEWAY_AUTH_MODE: ${OPENCLAW_GATEWAY_AUTH_MODE}
      OPENCLAW_GATEWAY_ALLOWED_ORIGINS: ${OPENCLAW_GATEWAY_ALLOWED_ORIGINS}
      OPENCLAW_GATEWAY_ALLOW_INSECURE_AUTH: ${OPENCLAW_GATEWAY_ALLOW_INSECURE_AUTH}
      OPENCLAW_GATEWAY_DANGEROUSLY_DISABLE_DEVICE_AUTH: ${OPENCLAW_GATEWAY_DANGEROUSLY_DISABLE_DEVICE_AUTH}

      # Telegram Bot
      BOT_TELEGRAM_TOKEN: ${BOT_TELEGRAM_TOKEN}

      # Feishu
      BOT_FEISHU_APP_ID: ${BOT_FEISHU_APP_ID}
      BOT_FEISHU_SECRET: ${BOT_FEISHU_SECRET}

      # Dingtalk
      BOT_DING_CLIENT_ID: ${BOT_DING_CLIENT_ID}
      BOT_DING_SECRET: ${BOT_DING_SECRET}
      BOT_DING_ROBOT_CODE: ${BOT_DING_ROBOT_CODE}
      BOT_DING_CORP_ID: ${BOT_DING_CORP_ID}
      BOT_DING_AGENT_ID: ${BOT_DING_AGENT_ID}

      # QQ & Napcat
      BOT_QQ_APP_ID: ${BOT_QQ_APP_ID}
      BOT_QQ_SECRET: ${BOT_QQ_SECRET}
      BOT_NAPCAT_WS_PORT: ${BOT_NAPCAT_WS_PORT}
      BOT_NAPCAT_HTTP_URL: ${BOT_NAPCAT_HTTP_URL}
      BOT_NAPCAT_ACCESS_TOKEN: ${BOT_NAPCAT_ACCESS_TOKEN}
      BOT_NAPCAT_ADMINS: ${BOT_NAPCAT_ADMINS}

      # WeCom
      BOT_WECOM_TOKEN: ${BOT_WECOM_TOKEN}
      BOT_WECOM_AES_KEY: ${BOT_WECOM_AES_KEY}
      BOT_WECOM_MULTI_JSON: ${BOT_WECOM_MULTI_JSON}

      # OpenViking 长效记忆
      OPENVIKING_MEMORY_ENABLED: ${OPENVIKING_MEMORY_ENABLED:-false}
      OPENVIKING_BASE_URL: ${OPENVIKING_BASE_URL:-http://openviking:1933}
      OPENVIKING_API_KEY: ${OPENVIKING_API_KEY:-openviking-internal-key}
      OPENVIKING_AGENT_ID: ${OPENVIKING_AGENT_ID:-}
      OPENVIKING_AUTO_RECALL: ${OPENVIKING_AUTO_RECALL:-true}
      OPENVIKING_AUTO_CAPTURE: ${OPENVIKING_AUTO_CAPTURE:-true}

volumes:
  openviking-data:
